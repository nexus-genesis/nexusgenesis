name: CI

on:
  push:
    branches: [main, master, develop, 'temp-*', 'feature/**']
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    # Bumped 15 → 25 min: the job now also installs Foundry + compiles the
    # SmartAccount contract (forge build) before running the tests.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fix: the Smart Account on-chain tests (chain-eth golden E2E + mcp-server
      # setup/execute) require the compiled Foundry artifact. `contracts/solidity/
      # out/` is gitignored and absent on a fresh checkout, so we must build it
      # here — otherwise these tests hard-fail in CI (regression connection:
      # smoke-e2e + mcp-server both depend on it).
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry build output (contracts/solidity/out)
        uses: actions/cache@v4
        with:
          path: contracts/solidity/out
          key: forge-out-${{ hashFiles('contracts/solidity/**') }}
          restore-keys: |
            forge-out-

      - name: Forge build (solc 0.8.24)
        working-directory: contracts/solidity
        run: forge build --use 0.8.24

      - name: Verify deny-list single source (JS ↔ Solidity fixtures)
        run: npm run check:deny-list
        timeout-minutes: 5

      - name: Run Smart Account E2E sample (official EVM path)
        run: npm run e2e:smart-account --workspace examples
        timeout-minutes: 5

      - name: Test released security packages
        run: npm run test:release-packages
        timeout-minutes: 10

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          for file in $(find packages mcp-server scripts docs/examples -name "*.js" -not -path "*/node_modules/*"); do
            node -c "$file" || exit 1
          done

  foundry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # local foundry.toml pins solc to a sandbox-only binary (bin/solc-0.8.24.exe,
      # gitignored). On CI we override with the pinned upstream version so a fresh
      # checkout compiles deterministically via svm.
      - name: Forge build (solc 0.8.24)
        working-directory: contracts/solidity
        run: forge build --use 0.8.24

      - name: Forge test (solc 0.8.24)
        working-directory: contracts/solidity
        run: forge test --use 0.8.24 -vvv
        timeout-minutes: 15
