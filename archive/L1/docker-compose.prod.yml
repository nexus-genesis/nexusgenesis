version: '3.8'

services:
  nexusgenesis:
    image: ghcr.io/nexus-genesis/nexusgenesis:latest
    container_name: nexusgenesis-node
    restart: unless-stopped
    ports:
      - "19891:19891"
    volumes:
      - nexusgenesis-data:/app/data
      - nexusgenesis-logs:/app/logs
      - ./data/agents:/app/data/agents
    environment:
      - NODE_ENV=production
      - PORT=19891
      - P2P_PORT=9848
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # External review 2026-08-24: agentWalletManager REQUIRES this key in
      # production (src/wallet/agentWalletManager.js fails closed without it).
      # The :? syntax makes `docker compose up` fail immediately with a clear
      # error when the operator forgot to export it — instead of the container
      # starting and crash-looping.
      - NG_WALLET_MASTER_KEY=${NG_WALLET_MASTER_KEY:?NG_WALLET_MASTER_KEY is required in production (base64, 32 bytes). Generate: openssl rand -base64 32}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:19891/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nexusgenesis-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  nginx:
    image: nginx:alpine
    container_name: nexusgenesis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - nexusgenesis
    networks:
      - nexusgenesis-net

volumes:
  nexusgenesis-data:
    driver: local
  nexusgenesis-logs:
    driver: local

networks:
  nexusgenesis-net:
    driver: bridge