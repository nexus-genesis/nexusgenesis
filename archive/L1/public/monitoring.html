<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusGenesis - 系统监控</title>
<style>
:root {
  --bg: #0a0e17; --bg2: #111827; --bg3: #1a2332; --bg4: #1f2a3a;
  --accent: #00d4aa; --accent2: #00b894; --accent3: #00a8ff;
  --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  --border: #1e293b; --danger: #ef4444; --warning: #f59e0b; --success: #22c55e;
  --purple: #8b5cf6; --orange: #f97316; --pink: #ec4899;
  --radius: 8px; --radius2: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
}
header {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
}
.logo { font-size: 20px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.logo .icon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), var(--accent3)); border-radius: 6px; }
.nav-links { display: flex; gap: 16px; }
.nav-links a {
  color: var(--text2); text-decoration: none; font-size: 14px;
  padding: 6px 12px; border-radius: 6px; transition: all .2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--accent); background: rgba(0,212,170,.08); }
.header-right { display: flex; align-items: center; gap: 14px; }
.status-dot {
  width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px;
}
.status-dot.healthy { background: var(--success); box-shadow: 0 0 8px var(--success); }
.status-dot.warning { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
.status-dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.status-dot.degraded { background: var(--warning); }
.refresh-btn {
  background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
  padding: 6px 14px; border-radius: var(--radius); font-size: 12px; cursor: pointer; transition: all .2s;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent); }
.auto-refresh { font-size: 11px; color: var(--text3); }
.container { max-width: 1400px; margin: 0 auto; padding: 24px; flex: 1; width: 100%; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.stat-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2);
  padding: 18px; position: relative; overflow: hidden;
}
.stat-card .label { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
.stat-card .value { font-size: 28px; font-weight: 700; }
.stat-card .suffix { font-size: 13px; color: var(--text3); margin-left: 4px; }
.stat-card .trend { font-size: 12px; margin-top: 4px; }
.trend-up { color: var(--success); }
.trend-down { color: var(--danger); }
.trend-stable { color: var(--text3); }
.stat-card.value-accent .value { color: var(--accent); }
.stat-card.value-blue .value { color: var(--accent3); }
.stat-card.value-purple .value { color: var(--purple); }
.stat-card.value-orange .value { color: var(--orange); }

.dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
.chart-section {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2);
  padding: 20px;
}
.chart-section h3 { font-size: 15px; margin-bottom: 16px; color: var(--accent3); display: flex; align-items: center; gap: 8px; }
.metrics-list { display: flex; flex-direction: column; gap: 12px; }
.metric-row {
  display: flex; align-items: center; gap: 12px; padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.metric-row:last-child { border-bottom: none; }
.metric-row .name { flex: 1; font-size: 13px; color: var(--text2); min-width: 120px; }
.metric-row .bar-wrap { flex: 2; height: 8px; background: var(--bg4); border-radius: 4px; overflow: hidden; }
.metric-row .bar {
  height: 100%; border-radius: 4px; transition: width .6s ease;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
}
.bar-warning { background: linear-gradient(90deg, var(--warning), #ffbb33) !important; }
.bar-danger { background: linear-gradient(90deg, var(--danger), #ff6b6b) !important; }
.metric-row .val {
  min-width: 70px; text-align: right; font-size: 13px; font-weight: 600; font-family: monospace;
}

.alerts-section { max-height: 360px; overflow-y: auto; }
.alert-card {
  padding: 12px 14px; border-radius: var(--radius); margin-bottom: 8px;
  border-left: 3px solid var(--warning); background: var(--bg3);
  display: flex; align-items: flex-start; gap: 10px;
}
.alert-card.critical { border-left-color: var(--danger); }
.alert-card.error { border-left-color: var(--pink); }
.alert-card.warning { border-left-color: var(--warning); }
.alert-card .alert-icon { font-size: 18px; flex-shrink: 0; }
.alert-card .alert-body { flex: 1; }
.alert-card .alert-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.alert-card .alert-msg { font-size: 12px; color: var(--text2); }
.alert-card .alert-time { font-size: 10px; color: var(--text3); margin-top: 4px; }
.empty-alerts { text-align: center; color: var(--success); padding: 20px; font-size: 14px; }

.checks-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
.check-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; text-align: center;
}
.check-card .check-icon { font-size: 22px; margin-bottom: 6px; }
.check-card .check-name { font-size: 13px; color: var(--text2); }
.check-card .check-status { font-size: 11px; margin-top: 4px; }
.check-ok { color: var(--success); }
.check-warn { color: var(--warning); }
.check-error { color: var(--danger); }

.gauge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
.gauge-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2);
  padding: 20px; text-align: center;
}
.gauge-card .gauge-label { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; }
.gauge-card .gauge-value { font-size: 36px; font-weight: 700; margin: 8px 0; }
.gauge-card .gauge-sub { font-size: 12px; color: var(--text3); }
.gauge-card canvas { margin: 8px auto; display: block; }

.overflow-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }

button { font-family: inherit; }

@media (max-width: 1024px) {
  .stats-grid, .checks-grid { grid-template-columns: repeat(2, 1fr); }
  .dashboard-grid, .overflow-section { grid-template-columns: 1fr; }
  .gauge-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<header>
  <div class="logo"><div class="icon"></div>NexusGenesis</div>
  <div class="nav-links">
    <a href="/dashboard">仪表盘</a>
    <a href="/contract-editor">合约编辑器</a>
    <a href="/docs">API 文档</a>
    <a href="/docs/bridge">跨链桥</a>
    <a href="/monitoring" class="active">系统监控</a>
  </div>
  <div class="header-right">
    <span class="auto-refresh">自动刷新: 5s</span>
    <button class="refresh-btn" onclick="refresh()">↻ 刷新</button>
    <span id="overallStatus"><span class="status-dot healthy"></span>Healthy</span>
  </div>
</header>

<div class="container">
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card value-accent"><div class="label">区块高度</div><div class="value" id="statBlockHeight">0</div><div class="suffix">blocks</div><div class="trend trend-stable">--</div></div>
    <div class="stat-card value-blue"><div class="label">已部署合约</div><div class="value" id="statContracts">0</div><div class="suffix">contracts</div><div class="trend trend-stable">--</div></div>
    <div class="stat-card value-purple"><div class="label">跨链转移</div><div class="value" id="statBridge">0</div><div class="suffix">transfers</div><div class="trend trend-stable">--</div></div>
    <div class="stat-card value-orange"><div class="label">注册智能体</div><div class="value" id="statAgents">0</div><div class="suffix">agents</div><div class="trend trend-stable">--</div></div>
  </div>

  <div class="checks-grid" id="checksGrid"></div>

  <div class="dashboard-grid">
    <div class="chart-section">
      <h3>📊 系统指标</h3>
      <div class="metrics-list" id="metricsList"></div>
    </div>
    <div class="chart-section alerts-section">
      <h3>🔔 活跃告警 (<span id="alertCount">0</span>)</h3>
      <div id="alertsList"></div>
    </div>
  </div>

  <div class="overflow-section">
    <div class="chart-section">
      <h3>🖥️ 系统信息</h3>
      <div class="metrics-list" id="sysInfo"></div>
    </div>
    <div class="chart-section">
      <h3>📋 最近事件</h3>
      <div id="eventLog" style="font-size:12px;color:var(--text2);max-height:200px;overflow-y:auto;"></div>
    </div>
  </div>
</div>

<script>
const COLORS = {
  cpu: [0, 0, 212, 170],
  mem: [0, 168, 255],
  disk: [139, 92, 246]
};

function drawGauge(canvasId, value, color, label) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2, r = 38;
  const pct = Math.min(value, 100) / 100;
  
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0.75 * Math.PI, 2.25 * Math.PI);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 8;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0.75 * Math.PI, 0.75 * Math.PI + pct * 1.5 * Math.PI);
  ctx.strokeStyle = `rgb(${color.join(',')})`;
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.stroke();
}

function formatUptime(sec) {
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = Math.floor(sec % 60);
  if (d > 0) return `${d}d ${h}h ${m}m`;
  if (h > 0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}

function formatBytes(b) {
  if (!b) return '0 B';
  if (b > 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
  if (b > 1048576) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1024).toFixed(0) + ' KB';
}

function getBarClass(pct, thresholds) {
  if (pct >= thresholds[1]) return 'bar-danger';
  if (pct >= thresholds[0]) return 'bar-warning';
  return '';
}

function getColorByPct(pct) {
  if (pct > 85) return 'var(--danger)';
  if (pct > 70) return 'var(--warning)';
  return 'var(--accent)';
}

function getStatusDot(status) {
  if (status === 'healthy' || status === 'ok') return '<span class="status-dot healthy"></span>';
  if (status === 'warning') return '<span class="status-dot warning"></span>';
  if (status === 'degraded' || status === 'error') return '<span class="status-dot error"></span>';
  if (status === 'critical') return '<span class="status-dot error"></span>';
  return '<span class="status-dot warning"></span>';
}

async function refresh() {
  try {
    const res = await fetch('/api/v1/monitoring/overview');
    const json = await res.json();
    if (!json.success || !json.data) return;
    const d = json.data;

    document.getElementById('statBlockHeight').textContent = d.overview?.blockHeight || 0;
    document.getElementById('statContracts').textContent = d.overview?.contracts || 0;
    document.getElementById('statBridge').textContent = d.overview?.bridgeTransfers || 0;
    document.getElementById('statAgents').textContent = d.overview?.agents || 0;

    const overall = d.status || 'healthy';
    const osEl = document.getElementById('overallStatus');
    osEl.innerHTML = getStatusDot(overall) + (overall.charAt(0).toUpperCase() + overall.slice(1));

    const m = d.metrics || {};
    const sys = d.system || {};

    const metrics = [
      { key: 'cpu_usage', name: 'CPU 使用率', value: m.cpu_usage?.value || 0, unit: '%', max: 100, thresholds: [75, 90] },
      { key: 'memory_usage', name: '内存使用率', value: m.memory_usage?.value || ((sys.memoryUsage?.heapUsed / sys.memoryUsage?.heapTotal * 100) || 0), unit: '%', max: 100, thresholds: [70, 85] },
      { key: 'disk_usage', name: '磁盘可用', value: m.disk_usage?.value || 0, unit: '%', max: 100, thresholds: [25, 15], inverted: true },
      { key: 'blockchain_height', name: '区块高度', value: m.blockchain_height?.value || 0, unit: '', max: 1, thresholds: [0, 0], raw: true },
      { key: 'p2p_peer_count', name: 'P2P 节点数', value: m.p2p_peer_count?.value || 0, unit: '', max: 1, thresholds: [0, 0], raw: true },
      { key: 'agent_health', name: 'Agent 健康度', value: m.agent_health?.value || 95, unit: '%', max: 100, thresholds: [70, 50] },
      { key: 'api_success_rate', name: 'API 成功率', value: m.api_success_rate?.value || 99.5, unit: '%', max: 100, thresholds: [95, 90] },
      { key: 'task_execution_rate', name: '任务执行率', value: m.task_execution_rate?.value || 85, unit: '%', max: 100, thresholds: [70, 50] },
      { key: 'cache_hit_rate', name: '缓存命中率', value: m.cache_hit_rate?.value || 90, unit: '%', max: 100, thresholds: [80, 60] },
      { key: 'api_response_time', name: 'API 响应时间', value: m.api_response_time?.value || sys.memoryUsage?.heapUsed ? (sys.memoryUsage.heapUsed / 1024 / 1024).toFixed(1) : 12, unit: 'ms', max: 500, thresholds: [200, 400] },
    ];

    document.getElementById('metricsList').innerHTML = metrics.map(mt => {
      if (mt.raw) {
        return `<div class="metric-row">
          <span class="name">${mt.name}</span>
          <span class="bar-wrap" style="background:transparent;"></span>
          <span class="val" style="color:var(--accent);">${mt.value}</span>
        </div>`;
      }
      const pct = (mt.value / mt.max * 100);
      const barClass = mt.inverted ? getBarClass(100 - pct, [25, 15].map(v => v / mt.max * 100)) : getBarClass(pct, mt.thresholds);
      const color = getColorByPct(mt.inverted ? (100 - pct) : pct);
      return `<div class="metric-row">
        <span class="name">${mt.name}</span>
        <div class="bar-wrap"><div class="bar ${barClass}" style="width:${Math.min(pct, 100)}%;background:${color};"></div></div>
        <span class="val" style="color:${color};">${typeof mt.value === 'number' ? mt.value.toFixed(1) : mt.value}${mt.unit}</span>
      </div>`;
    }).join('');

    const alerts = d.alerts?.details || [];
    document.getElementById('alertCount').textContent = alerts.length;
    if (alerts.length === 0) {
      document.getElementById('alertsList').innerHTML = '<div class="empty-alerts">✅ 无活跃告警</div>';
    } else {
      document.getElementById('alertsList').innerHTML = alerts.map(a => `
        <div class="alert-card ${a.level?.toLowerCase()}">
          <div class="alert-icon">${a.level === 'CRITICAL' || a.level === 'critical' ? '🔴' : a.level === 'ERROR' || a.level === 'error' ? '🟣' : '🟡'}</div>
          <div class="alert-body">
            <div class="alert-name">${a.name}</div>
            <div class="alert-msg">${a.message} (值: ${a.metricValue})</div>
            <div class="alert-time">${a.timestamp ? new Date(a.timestamp).toLocaleString() : ''}${a.escalated ? ' ⚠️已升级' : ''}</div>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('sysInfo').innerHTML = `
      <div class="metric-row"><span class="name">运行时间</span><span class="bar-wrap" style="background:transparent;"></span><span class="val" style="color:var(--accent);">${formatUptime(sys.uptime || 0)}</span></div>
      <div class="metric-row"><span class="name">Node.js</span><span class="bar-wrap" style="background:transparent;"></span><span class="val" style="color:var(--accent3);">${sys.nodeVersion || '-'}</span></div>
      <div class="metric-row"><span class="name">平台</span><span class="bar-wrap" style="background:transparent;"></span><span class="val" style="color:var(--text2);">${sys.platform || '-'} (${sys.arch || '-'})</span></div>
      <div class="metric-row"><span class="name">堆内存使用</span><span class="bar-wrap" style="background:transparent;"></span><span class="val" style="color:var(--accent);">${formatBytes(sys.memoryUsage?.heapUsed || 0)} / ${formatBytes(sys.memoryUsage?.heapTotal || 0)}</span></div>
      <div class="metric-row"><span class="name">RSS</span><span class="bar-wrap" style="background:transparent;"></span><span class="val" style="color:var(--purple);">${formatBytes(sys.memoryUsage?.rss || 0)}</span></div>
      <div class="metric-row"><span class="name">系统用户CPU</span><span class="bar-wrap" style="background:transparent;"></span><span class="val" style="color:var(--text2);">${sys.cpuUsage?.user || 0}μs</span></div>
    `;

    document.getElementById('eventLog').innerHTML = `
      <div style="padding:4px 0;color:var(--text3);">→ 系统状态: <span style="color:var(--accent);">${overall}</span></div>
      <div style="padding:4px 0;color:var(--text3);">→ 活跃告警: <span style="color:${alerts.length > 0 ? 'var(--warning)' : 'var(--success)'};">${alerts.length}</span></div>
      <div style="padding:4px 0;color:var(--text3);">→ 合约总数: <span style="color:var(--accent3);">${d.overview?.contracts || 0}</span></div>
      <div style="padding:4px 0;color:var(--text3);">→ 跨链转移: <span style="color:var(--purple);">${d.overview?.bridgeTransfers || 0}</span></div>
      <div style="padding:4px 0;color:var(--text3);">→ 最后更新: <span style="color:var(--text2);">${new Date().toLocaleTimeString()}</span></div>
    `;

    try {
      const hRes = await fetch('/api/v1/monitoring/health');
      const hJson = await hRes.json();
      if (hJson.success && hJson.checks) {
        const checks = hJson.checks;
        document.getElementById('checksGrid').innerHTML = Object.entries(checks).map(([k, v]) => `
          <div class="check-card">
            <div class="check-icon">${v.status === 'ok' ? '✅' : v.status === 'warning' ? '⚠️' : '❌'}</div>
            <div class="check-name">${k}</div>
            <div class="check-status check-${v.status === 'ok' ? 'ok' : v.status === 'warning' ? 'warn' : 'error'}">${v.status}${v.value ? ' · ' + v.value : ''}</div>
          </div>
        `).join('');
      }
    } catch(e) {}

    document.title = `[${overall.toUpperCase()}] NexusGenesis - 系统监控`;
  } catch(e) {
    console.error('Refresh error:', e);
  }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
